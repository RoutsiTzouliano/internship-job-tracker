<h1>Available Jobs</h1>

    <form method="GET">
        <input type="text" name="search" value="{{ search }}" placeholder="Search job title...">
        <button type="submit">Filter</button>
    </form>

{% for job in jobs %}

    <h2>{{ job.title }}</h2>

    <p>Company: {{ job.company.name }}</p>

    <p>{{ job.description }}</p>

    <hr>

{% empty %}

    <p>No jobs available.</p>

{% endfor %}

{% if user.is_authenticated %}

    <p>Welcome, {{ user.username }}!</p>

    <form method="POST" action="{% url 'candidate_logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>

{% else %}

    <a href="{% url 'candidate_login' %}">Login</a>
    <a href="{% url 'candidate_register' %}">Register</a>

{% endif %}
